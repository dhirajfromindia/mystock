<!DOCTYPE html>
<html>
<head>
<title>Market Cap Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:Arial;padding:20px;background:#111;color:#fff}
.card{background:#222;padding:15px;border-radius:12px;margin:10px 0}
h1{color:#00ff99}
</style>
</head>
<body>

<h1>📈 Market Cap Dashboard</h1>

<div id="box"></div>

<script>
fetch("data.json")
.then(r=>r.json())
.then(data=>{

let html="";

data.slice(0,20).forEach(x=>{
html+=`
<div class='card'>
${x.rank}. ${x.name}
</div>`;
});

document.getElementById("box").innerHTML=html;

});
</script>

</body>
</html>

name: Stock Tracker Email

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *"  # 8:30 PM IST
permissions:
  contents: write
  
jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tracker
        run: node tracker.js
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TO_EMAIL_LIST: ${{ secrets.TO_EMAIL_LIST }}
          STOCK_API_URL: ${{ secrets.STOCK_API_URL }}
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add data.json
          git commit -m "daily update" || echo no change
          git push

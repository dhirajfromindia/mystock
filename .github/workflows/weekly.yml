name: Weekly Summary Email

on:
  schedule:
    - cron: "30 15 * * 0"  # Sunday 8:30 PM IST
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install axios nodemailer

      - name: Run weekly script
        run: node weekly.js
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TO_EMAIL_LIST: ${{ secrets.TO_EMAIL_LIST }}
          STOCK_API_URL: ${{ secrets.STOCK_API_URL }}
